<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minigames</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Spectral:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #191129;
    --bg-deep: #120c1f;
    --panel: #241a3a;
    --panel-edge: rgba(201,164,97,0.25);
    --gold: #c9a461;
    --gold-bright: #e6c98a;
    --ink: #e9e0cf;
    --muted: #9b8fb8;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at top, var(--bg) 0%, var(--bg-deep) 70%);
    font-family:'Spectral', serif;
    color: var(--ink);
    display:flex; justify-content:center;
    -webkit-font-smoothing: antialiased;
  }
  .stage{ width:100%; max-width: 680px; padding: 48px 20px 60px; }

  .masthead{ display:flex; flex-direction:column; align-items:center; margin-bottom: 40px; }
  .masthead h1{
    font-family:'Cinzel', serif; font-weight:700; letter-spacing:0.12em;
    font-size: clamp(24px, 6vw, 32px); margin:0 0 6px; color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(201,164,97,0.35);
  }
  .masthead .sub{ font-size:12.5px; letter-spacing:0.08em; color: var(--muted); font-family:'IBM Plex Mono', monospace; }

  .minigame-list{ display:flex; flex-direction:column; gap: 14px; }

  .minigame-card{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
  }
  .minigame-card:hover{
    border-color: var(--gold);
    background: rgba(201,164,97,0.06);
    transform: translateX(2px);
  }
  .minigame-card .info{ min-width: 0; }
  .minigame-card .name{
    font-family:'Cinzel', serif; font-size: 16.5px; color: var(--gold-bright);
    letter-spacing: 0.02em; margin-bottom: 4px;
  }
  .minigame-card .desc{ font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .minigame-card .arrow{
    font-family:'IBM Plex Mono', monospace; color: var(--gold);
    font-size: 18px; flex-shrink: 0;
  }

  footer{
    margin-top: 44px; text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--muted); letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <h1>Minigames</h1>
    <div class="sub">SELECT A MINIGAME</div>
  </div>

  <div class="minigame-list">

    <a class="minigame-card" href="rune-match/index.html">
      <div class="info">
        <div class="name">Rune Match</div>
        <div class="desc">Memory Matching Minigame</div>
      </div>
      <div class="arrow">&rarr;</div>
    </a>

    <a class="minigame-card" href="shortcut-sigils/index.html">
      <div class="info">
        <div class="name">Shortcut Sigils</div>
        <div class="desc">Keyboard Shortcut Minigame for Discord, Excel, Confluence, and more!</div>
      </div>
      <div class="arrow">&rarr;</div>
    </a>

    <!-- <a class="Minigame-card" href="minigames/TEMPLATETEMPLATE/index.html">
      <div class="info">
          <div class="name">TEMPLATETEMPLATE</div>
        <div class="desc">TEMPLATETEMPLATE</div>
      </div>
      <div class="arrow">&rarr;</div>
    </a> -->

  </div>

  <footer>Minigames :O</footer>
</div>
</body>
</html>
