<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clip Finder</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #16181d; color: #e8e8e8; margin: 0; padding: 24px; }
    a { color: #7dbbff; }
    h1 { margin-top: 0; }
    nav { margin-bottom: 20px; }
    nav a { margin-right: 16px; text-decoration: none; }
    .upload-box { background: #21242c; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .flash { background: #33402a; border: 1px solid #4a5c3a; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .clip-card { background: #21242c; border: 1px solid #333; border-radius: 8px; padding: 12px; }
    .clip-card video { width: 100%; border-radius: 4px; background: #000; }
    .clip-meta { font-size: 13px; color: #999; margin: 8px 0; }
    .clip-actions { display: flex; gap: 8px; align-items: center; }
    select, button { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #2a2e38; color: #eee; }
    button.approve { background: #2f6b3f; border-color: #3d8a52; cursor: pointer; }
    button.reject { background: #6b2f2f; border-color: #8a3d3d; cursor: pointer; }
    .empty { color: #888; padding: 40px 0; text-align: center; }

    .trim-wrap { margin: 10px 0; }
    .trim-label { font-size: 12px; color: #999; margin-bottom: 6px; }
    .trim-range-text { color: #7dbbff; }
    .trim-slider { position: relative; height: 28px; }
    .trim-slider input[type="range"] {
      position: absolute; top: 0; left: 0; width: 100%; margin: 0;
      -webkit-appearance: none; appearance: none; background: transparent;
      pointer-events: none; /* only the thumb should be draggable */
    }
    .trim-slider input[type="range"]::-webkit-slider-runnable-track {
      height: 4px; background: #333; border-radius: 2px;
    }
    .trim-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto;
      width: 14px; height: 14px; border-radius: 50%;
      background: #7dbbff; border: 2px solid #16181d; margin-top: -5px; cursor: pointer;
    }
    .trim-slider input[type="range"]::-moz-range-track {
      height: 4px; background: #333; border-radius: 2px;
    }
    .trim-slider input[type="range"]::-moz-range-thumb {
      pointer-events: auto; width: 14px; height: 14px; border-radius: 50%;
      background: #7dbbff; border: 2px solid #16181d; cursor: pointer;
    }
    .preview-trim-btn {
      margin-top: 6px; background: #2a2e38; border: 1px solid #444; color: #7dbbff;
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .preview-trim-btn:hover { background: #333844; }
  </style>
</head>
<body>
  <h1>🎮 Clip Finder</h1>
  <nav>
    <a href="{{ url_for('review_queue') }}">Review Queue</a>
    <a href="{{ url_for('history') }}">History</a>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
